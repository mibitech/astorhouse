server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos de build têm hash no nome: mudam de nome a cada versão, podem ficar em cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A página (e as rotas da SPA, que caem nela) sempre revalida. Sem isso o navegador
    # aplicava cache heurístico ao index.html e o cliente seguia dias numa versão antiga,
    # sem as correções já publicadas.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
